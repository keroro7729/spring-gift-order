spring:
  application:
    name: spring-gift

  h2:
    console:
      enabled: true

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:/sql/data.sql

  profiles:
    active: dev


kakao:
  client-id: dummy-client-id
  redirect-login: http://localhost:8080/api/oauth/kakao/login

