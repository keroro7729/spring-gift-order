spring:
  application:
    name: spring-gift

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:/sql/data.sql

kakao:
  client-id: ${KAKAO_CLIENT_ID:dummy-client-id}
  redirect-login: ${KAKAO_REDIRECT_LOGIN:http://localhost:8080/api/oauth/kakao/login}
